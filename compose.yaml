services:
  accounting:
    build: .
    ports:
      - "127.0.0.1:3108:3108"
    environment:
      APP_ORIGIN: http://localhost:3108
      APP_PASSWORD_FILE: /run/secrets/app_password
    secrets:
      - app_password
    volumes:
      - accounting_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
secrets:
  app_password:
    file: ./secrets/app-password
volumes:
  accounting_data:
